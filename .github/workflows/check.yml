name: Check demos

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/rust-target
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.5
          run_install: false
      - name: Install locked JavaScript dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir webhook-monitor install --frozen-lockfile --ignore-scripts
          pnpm --dir parsed-streams-monitor install --frozen-lockfile --ignore-scripts
      - name: Check JavaScript and docs
        run: |
          pnpm format:check
          pnpm docs:check
          pnpm test
      - name: Select pinned Rust toolchain
        run:
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Check formatting and native Rust tests
        run: |
          for demo in webhook-monitor parsed-streams-monitor; do
            cargo fmt --manifest-path "$demo/Cargo.toml" --check
            cargo test --locked --manifest-path "$demo/Cargo.toml"
          done
      - name: Build and exercise the SBF programs
        run: |
          for demo in webhook-monitor parsed-streams-monitor; do
            pnpm --dir "$demo" build
            pnpm --dir "$demo" test:sbf
          done
      - name: Check native tunnel executable
        env:
          PORT: 3000
        run: bash webhook-monitor/scripts/https-tunnel.sh --version
