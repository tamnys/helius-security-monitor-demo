[package]
name = "failsafe-vault"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
solana-program = "=2.2.1"

[dev-dependencies]
solana-program-test = "=2.2.0"
solana-sdk = "=2.2.1"
tokio = { version = "=1.43.0", features = ["macros", "rt-multi-thread"] }
